<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Her Health</title>
    <style>
      :root {
        --ink: #14181f;
        --muted: #5b6472;
        --line: #dfe1e4;
        --accent: #164e63;
        --paper: #f6f6f3;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      .eyebrow {
        margin: 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 4px 0 12px;
        font: 600 18px/1.25 Georgia, serif;
      }
      #page {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .levels {
        display: inline-flex;
        padding: 3px;
        margin-bottom: 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
      }
      .levels button {
        border: 0;
        border-radius: 4px;
        padding: 5px 12px;
        background: none;
        color: var(--muted);
        font: inherit;
        cursor: pointer;
      }
      .levels button[aria-pressed="true"] {
        background: var(--accent);
        color: #fff;
      }
      .primary {
        width: 100%;
        border: 0;
        border-radius: 6px;
        padding: 10px;
        background: var(--accent);
        color: #fff;
        font: 600 14px system-ui, sans-serif;
        cursor: pointer;
      }
      form {
        display: flex;
        gap: 6px;
        margin-top: 12px;
      }
      input {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px;
        font: inherit;
      }
      form button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      .note {
        margin: 12px 0 0;
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">Her Health</p>
    <h1>Turn what you're reading into a lesson</h1>
    <p id="page"></p>
    <div class="levels" role="group" aria-label="Level">
      <button type="button" data-level="everyday" aria-pressed="true">Everyday</button>
      <button type="button" data-level="med" aria-pressed="false">Med student</button>
    </div>
    <button class="primary" id="teach">Teach me this page</button>
    <form id="topic-form">
      <input id="topic" placeholder="Or type a topic, e.g. lupus" maxlength="120" />
      <button>Go</button>
    </form>
    <p class="note">
      Lessons only use reviewed medical sources, and every fact is checked against its source. Education, not
      medical advice.
    </p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
